version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
    build:
      commands:
        - if [ -n "$OPENAI_API_KEY" ]; then printf "OPENAI_API_KEY=%s\n" "$OPENAI_API_KEY" >> .env.production; fi
        - if [ -n "$OPENAI_MODEL" ]; then printf "OPENAI_MODEL=%s\n" "$OPENAI_MODEL" >> .env.production; fi
        - if [ -n "$OPENAI_EMBEDDING_MODEL" ]; then printf "OPENAI_EMBEDDING_MODEL=%s\n" "$OPENAI_EMBEDDING_MODEL" >> .env.production; fi
        - if [ -n "$RAG_ADMIN_IMPORT_TOKEN" ]; then printf "RAG_ADMIN_IMPORT_TOKEN=%s\n" "$RAG_ADMIN_IMPORT_TOKEN" >> .env.production; fi
        - if [ -n "$ACTIVITY_AUTOFILL_RAG_ENABLED" ]; then printf "ACTIVITY_AUTOFILL_RAG_ENABLED=%s\n" "$ACTIVITY_AUTOFILL_RAG_ENABLED" >> .env.production; fi
        - if [ -n "$ACTIVITY_AUTOFILL_RAG_PA_ONLY" ]; then printf "ACTIVITY_AUTOFILL_RAG_PA_ONLY=%s\n" "$ACTIVITY_AUTOFILL_RAG_PA_ONLY" >> .env.production; fi
        - if [ -n "$ACTIVITY_AUTOFILL_RAG_AUDIT_ENABLED" ]; then printf "ACTIVITY_AUTOFILL_RAG_AUDIT_ENABLED=%s\n" "$ACTIVITY_AUTOFILL_RAG_AUDIT_ENABLED" >> .env.production; fi
        - if [ -n "$ENABLE_DELIVERABLE_ELIGIBILITY_CHECK" ]; then printf "ENABLE_DELIVERABLE_ELIGIBILITY_CHECK=%s\n" "$ENABLE_DELIVERABLE_ELIGIBILITY_CHECK" >> .env.production; fi
        - if [ -n "$NEXT_PUBLIC_ENABLE_DELIVERABLE_ELIGIBILITY_CHECK" ]; then printf "NEXT_PUBLIC_ENABLE_DELIVERABLE_ELIGIBILITY_CHECK=%s\n" "$NEXT_PUBLIC_ENABLE_DELIVERABLE_ELIGIBILITY_CHECK" >> .env.production; fi
        - if [ -n "$NEXT_PUBLIC_ENABLE_REPORTING_WORK_BLOCKS" ]; then printf "NEXT_PUBLIC_ENABLE_REPORTING_WORK_BLOCKS=%s\n" "$NEXT_PUBLIC_ENABLE_REPORTING_WORK_BLOCKS" >> .env.production; fi
        - if [ -n "$NEXT_PUBLIC_ENABLE_ANEXA10_DETERMINISTIC_DOCX" ]; then printf "NEXT_PUBLIC_ENABLE_ANEXA10_DETERMINISTIC_DOCX=%s\n" "$NEXT_PUBLIC_ENABLE_ANEXA10_DETERMINISTIC_DOCX" >> .env.production; fi
        - if [ -n "$COGNITO_SYNC_AWS_ACCESS_KEY_ID" ]; then printf "COGNITO_SYNC_AWS_ACCESS_KEY_ID=%s\n" "$COGNITO_SYNC_AWS_ACCESS_KEY_ID" >> .env.production; fi
        - if [ -n "$COGNITO_SYNC_AWS_SECRET_ACCESS_KEY" ]; then printf "COGNITO_SYNC_AWS_SECRET_ACCESS_KEY=%s\n" "$COGNITO_SYNC_AWS_SECRET_ACCESS_KEY" >> .env.production; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
